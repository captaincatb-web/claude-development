<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japan Route · 5 Days</title>
<style>
:root{
  --page:#050709; --ink:#ece7df; --dim:rgba(236,231,223,.55); --line:rgba(236,231,223,.16); --accent:#f2b56b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);
  font-family:"Pretendard",system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;overflow:hidden}
#stage{position:relative;line-height:0}
canvas{width:100%;height:100%;display:block;border-radius:8px;
  box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05)}
#bar{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;min-height:44px;margin-bottom:14px}
button,select{font:600 14px/1 "Pretendard",system-ui,sans-serif;color:var(--ink);background:#12171c;
  border:1px solid var(--line);border-radius:999px;padding:12px 18px;cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:rgba(236,231,223,.4)}
button.primary{background:var(--accent);color:#1b1206;border-color:transparent}
button:disabled,select:disabled{opacity:.45;cursor:default}
select{padding:11px 14px}
#status{position:absolute;left:0;right:0;top:100%;margin-top:4px;font:500 13px/1.4 "Pretendard",system-ui,sans-serif;color:var(--dim);text-align:center;white-space:nowrap}
body.still{padding:0;gap:0}
body.still #bar{display:none}
body.still canvas{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="bar">
  <button id="play" type="button">다시 재생</button>
  <button id="save" type="button" class="primary">영상으로 저장</button>
  <select id="fps" aria-label="프레임레이트">
    <option value="60">60fps</option>
    <option value="30">30fps</option>
  </select>
  <span id="status"></span>
</div>

<script>
'use strict';
/* =====================================================================
   Travel route map animation · 1080×1920 · 15 s
   Map: Natural Earth 1:10m land + minor islands + lakes (public domain),
        clipped to Korea / Japan, Web-Mercator, embedded at the bottom.
   URL:  ?t=7.5  → still frame at 7.5 s (for frame checks)
   ===================================================================== */

const W = 1080, H = 1920, DUR = 15;

/* ---------- look ---------- */
const COLOR = {
  sea:      '#0d1a24',
  land:     '#283a48',
  coast:    'rgba(190,212,228,0.34)',
  shelf:    'rgba(130,176,206,0.07)',
  accent:   '#f2b56b',
  ink:      '#f4efe7',
  inkDim:   'rgba(244,239,231,0.60)',
  card:     'rgba(8,15,21,0.90)',
  cardEdge: 'rgba(255,255,255,0.08)',
  vehicle:  '#f6f2ea',
};
const FONT = '"Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif';

/* ---------- trip ---------- */
// side: where the card / label sits relative to the pin
// pin: drop time (s) · collapse: card shrinks to a small label · side: card above/below the pin
const STOPS = {
  seoul: { lon:126.4505, lat:37.4602, name:'SEOUL', ko:'서울 · 인천공항', day:'DEPARTURE', pin:0.15,  collapse:1.45,  side:'below' },
  osaka: { lon:135.5023, lat:34.6937, name:'OSAKA', ko:'오사카',          day:'DAY 1–2',   pin:4.85,  collapse:6.45,  side:'below' },
  kyoto: { lon:135.7681, lat:35.0116, name:'KYOTO', ko:'교토',            day:'DAY 3',     pin:7.40,  collapse:8.55,  side:'above' },
  tokyo: { lon:139.7671, lat:35.6812, name:'TOKYO', ko:'도쿄',            day:'DAY 4–5',   pin:10.75, collapse:12.30, side:'above' },
};
const STOP_ORDER = ['seoul','osaka','kyoto','tokyo'];

// prof = [accel share, decel share] of a smooth trapezoid speed profile
const LEGS = [
  { id:'flight', mode:'FLIGHT',     from:'seoul', to:'osaka', t0:1.05, t1:5.05,  prof:[0.34,0.40],
    route:'SEOUL → OSAKA' },
  { id:'train',  mode:'TRAIN',      from:'osaka', to:'kyoto', t0:6.20, t1:7.60,  prof:[0.40,0.42],
    route:'OSAKA → KYOTO', via:[[135.565,34.818],[135.617,34.852],[135.700,34.925]] },
  { id:'shink',  mode:'SHINKANSEN', from:'kyoto', to:'tokyo', t0:8.70, t1:10.95, prof:[0.16,0.27],
    route:'KYOTO → TOKYO', via:[[136.881,35.171],[137.735,34.704],[138.389,34.972],[139.155,35.256]] },
];

const CAM = {
  wide:   { lon:133.8, lat:36.4, scale:43 },   // opening: all of Korea + Japan
  kansai: 540,                                  // Osaka ↔ Kyoto close-up
  shink:  210,
  final:  { margin:115, routeY:800 },           // overview framing
  smooth: 0.3,                                  // seconds (gaussian σ)
};
const TITLE = { text:'JAPAN · 5 DAYS', sub:'SEOUL  →  OSAKA  →  KYOTO  →  TOKYO', at:12.9, y:1300 };

/* ---------- math ---------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,u) => a + (b - a) * u;
const prog  = (t,a,b) => clamp((t - a) / (b - a), 0, 1);
const smoother = u => u*u*u*(u*(u*6 - 15) + 10);
const sstep = (t,a,b) => smoother(prog(t,a,b));
const easeOutCubic = u => 1 - Math.pow(1 - u, 3);
const easeOutQuint = u => 1 - Math.pow(1 - u, 5);
const easeInCubic  = u => u*u*u;
const easeInOutCubic = u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;
const easeOutBack  = (u,k=1.5) => 1 + (k + 1)*Math.pow(u - 1, 3) + k*Math.pow(u - 1, 2);
// smooth trapezoid: cosine accel → cruise → cosine decel (continuous speed & accel)
function travel(u, a, d) {
  u = clamp(u, 0, 1);
  const vm = 1 / (1 - (a + d) / 2);
  if (u < a) return vm * (u/2 - a/(2*Math.PI) * Math.sin(Math.PI*u/a));
  if (u > 1 - d) { const w = 1 - u; return 1 - vm * (w/2 - d/(2*Math.PI) * Math.sin(Math.PI*w/d)); }
  return vm * (a/2 + (u - a));
}
function speedOf(u, a, d) { // normalised speed (0..1) for the same profile
  const vm = 1;
  if (u < a) return vm * (1 - Math.cos(Math.PI*u/a)) / 2;
  if (u > 1 - d) return vm * (1 - Math.cos(Math.PI*(1-u)/d)) / 2;
  return vm;
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ---------- projection (Mercator, 1 unit = 1° lon) ---------- */
const RAD = Math.PI / 180;
const mercY = lat => Math.log(Math.tan(Math.PI/4 + lat*RAD/2)) / RAD;
const wpt = (lon, lat) => ({ x: lon, y: -mercY(lat) });
const ORIGIN = { x: 135, y: -38 };   // local origin for Path2D precision

/* ---------- canvas ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });

/* ---------- geometry built at start ---------- */
let LAND_HI, LAND_LO, LAKES, VIGNETTE;
let CW, KC, SM, CF, SF;
let camTrack;

function decodeRings(str, q) {
  if (!str) return [];
  return str.split(';').map(r => {
    const v = r.split(',').map(Number);
    const pts = new Float64Array(v.length);
    let x = 0, y = 0;
    for (let i = 0; i < v.length; i += 2) {
      x += v[i]; y += v[i+1];
      pts[i] = x / q - ORIGIN.x; pts[i+1] = y / q - ORIGIN.y;
    }
    return pts;
  });
}
function simplify(pts, tol) { // Douglas–Peucker on closed ring (flat array)
  const n = pts.length / 2;
  if (n < 8) return pts;
  const keep = new Uint8Array(n); keep[0] = keep[n-1] = 1;
  const stack = [[0, n-1]]; const t2 = tol*tol;
  while (stack.length) {
    const [a, b] = stack.pop();
    const ax = pts[2*a], ay = pts[2*a+1], bx = pts[2*b], by = pts[2*b+1];
    const dx = bx - ax, dy = by - ay, L2 = dx*dx + dy*dy || 1e-12;
    let best = -1, bd = t2;
    for (let i = a + 1; i < b; i++) {
      const px = pts[2*i] - ax, py = pts[2*i+1] - ay;
      const u = clamp((px*dx + py*dy) / L2, 0, 1);
      const ex = px - u*dx, ey = py - u*dy, d2 = ex*ex + ey*ey;
      if (d2 > bd) { bd = d2; best = i; }
    }
    if (best > 0) { keep[best] = 1; stack.push([a, best], [best, b]); }
  }
  const out = [];
  for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[2*i], pts[2*i+1]);
  return out.length >= 6 ? out : pts;
}
function ringsToPath(rings) {
  const p = new Path2D();
  for (const r of rings) {
    p.moveTo(r[0], r[1]);
    for (let i = 2; i < r.length; i += 2) p.lineTo(r[i], r[i+1]);
    p.closePath();
  }
  return p;
}

function chaikin(pts, iters) {
  for (let k = 0; k < iters; k++) {
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const p = pts[i], q = pts[i+1];
      out.push({ x:.75*p.x + .25*q.x, y:.75*p.y + .25*q.y }, { x:.25*p.x + .75*q.x, y:.25*p.y + .75*q.y });
    }
    out.push(pts[pts.length-1]);
    pts = out;
  }
  return pts;
}
function resample(pts, n) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y));
  const L = cum[cum.length-1], out = [];
  let j = 0;
  for (let k = 0; k < n; k++) {
    const d = L * k / (n - 1);
    while (j < cum.length - 2 && cum[j+1] < d) j++;
    const f = (d - cum[j]) / ((cum[j+1] - cum[j]) || 1);
    out.push({ x: lerp(pts[j].x, pts[j+1].x, f), y: lerp(pts[j].y, pts[j+1].y, f) });
  }
  return out;
}
function finishLeg(leg, pts) {
  leg.pts = resample(pts, 420);
  leg.cum = [0];
  for (let i = 1; i < leg.pts.length; i++)
    leg.cum.push(leg.cum[i-1] + Math.hypot(leg.pts[i].x - leg.pts[i-1].x, leg.pts[i].y - leg.pts[i-1].y));
  leg.len = leg.cum[leg.cum.length-1];
}
function along(leg, u) {
  const L = clamp(u, 0, 1) * leg.len;
  let lo = 0, hi = leg.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (leg.cum[m] <= L) lo = m; else hi = m; }
  const f = clamp((L - leg.cum[lo]) / ((leg.cum[hi] - leg.cum[lo]) || 1), 0, 1);
  const p = leg.pts[lo], q = leg.pts[hi];
  return { x: lerp(p.x, q.x, f), y: lerp(p.y, q.y, f), a: Math.atan2(q.y - p.y, q.x - p.x), i: lo };
}
const legU = (leg, t) => travel(prog(t, leg.t0, leg.t1), leg.prof[0], leg.prof[1]);

function buildGeometry(map) {
  const land = decodeRings(map.land, map.q), lakes = decodeRings(map.lakes, map.q);
  LAND_HI = ringsToPath(land);
  LAND_LO = ringsToPath(land.map(r => simplify(r, 0.0045)));
  LAKES   = ringsToPath(lakes);

  for (const k in STOPS) STOPS[k].w = wpt(STOPS[k].lon, STOPS[k].lat);

  // flight: gentle arc bowing north
  const fl = LEGS[0], A = STOPS.seoul.w, B = STOPS.osaka.w;
  const mx = (A.x + B.x)/2, my = (A.y + B.y)/2, dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
  const C = { x: mx + dy/d * d*0.24, y: my - dx/d * d*0.24 };
  const arc = [];
  for (let i = 0; i <= 200; i++) { const u = i/200, v = 1-u;
    arc.push({ x: v*v*A.x + 2*v*u*C.x + u*u*B.x, y: v*v*A.y + 2*v*u*C.y + u*u*B.y }); }
  finishLeg(fl, arc);
  // rail legs: waypoints smoothed
  for (const leg of LEGS.slice(1)) {
    const pts = [STOPS[leg.from].w, ...leg.via.map(([lo, la]) => wpt(lo, la)), STOPS[leg.to].w];
    finishLeg(leg, chaikin(pts, 4));
  }

  // camera anchors
  CW = wpt(CAM.wide.lon, CAM.wide.lat);
  KC = { x:(STOPS.osaka.w.x + STOPS.kyoto.w.x)/2, y:(STOPS.osaka.w.y + STOPS.kyoto.w.y)/2 };
  SM = along(LEGS[2], 0.5);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const leg of LEGS) for (const p of leg.pts) { x0 = Math.min(x0,p.x); x1 = Math.max(x1,p.x); y0 = Math.min(y0,p.y); y1 = Math.max(y1,p.y); }
  SF = (W - 2*CAM.final.margin) / (x1 - x0);
  CF = { x:(x0 + x1)/2, y:(y0 + y1)/2 + (H/2 - CAM.final.routeY)/SF };

  buildCamera();
  buildVignette();
}

/* ---------- camera: target path → gaussian-smoothed track ----------
   Zoom is one monotone spline (in log-scale) that only changes direction once
   (push in to Kansai → pull back), and the pan never stalls at the same moment,
   so the camera is always moving: no stop-and-go. */
function pchip(keys) { // monotone cubic Hermite (Fritsch–Carlson)
  const n = keys.length, h = [], d = [], m = [];
  for (let i = 0; i < n - 1; i++) { h[i] = keys[i+1][0] - keys[i][0]; d[i] = (keys[i+1][1] - keys[i][1]) / h[i]; }
  m[0] = d[0]; m[n-1] = d[n-2];
  for (let i = 1; i < n - 1; i++) {
    if (d[i-1] * d[i] <= 0) m[i] = 0;
    else { const w1 = 2*h[i] + h[i-1], w2 = h[i] + 2*h[i-1]; m[i] = (w1 + w2) / (w1/d[i-1] + w2/d[i]); }
  }
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    if (t >= keys[n-1][0]) return keys[n-1][1];
    let i = 0; while (t > keys[i+1][0]) i++;
    const u = (t - keys[i][0]) / h[i], u2 = u*u, u3 = u2*u;
    return (2*u3 - 3*u2 + 1)*keys[i][1] + (u3 - 2*u2 + u)*h[i]*m[i] + (-2*u3 + 3*u2)*keys[i+1][1] + (u3 - u2)*h[i]*m[i+1];
  };
}
let zCurve;
function buildZoom() {
  const [fl, tr, sh] = LEGS, L = Math.log, f = k => fl.t0 + k*(fl.t1 - fl.t0);
  zCurve = pchip([
    [0,            L(CAM.wide.scale)],
    [fl.t0,        L(CAM.wide.scale*1.08)],
    [f(0.34),      L(62)],                 // plane still crossing toward the centre
    [f(0.50),      L(90)],
    [f(0.60),      L(122)],
    [f(0.75),      L(225)],
    [fl.t1,        L(CAM.kansai*0.78)],    // landing
    [tr.t0,        L(CAM.kansai*0.96)],
    [tr.t1 - 0.35, L(CAM.kansai*1.04)],    // only turn-around of the zoom (pan still moving)
    [sh.t0,        L(CAM.shink*1.57)],
    [sh.t0 + 0.85, L(CAM.shink*1.02)],
    [sh.t1 - 0.4,  L(CAM.shink*0.95)],
    [sh.t1 + 0.3,  L(CAM.shink*0.83)],
    [sh.t1 + 1.4,  L(SF*1.65)],
    [sh.t1 + 2.6,  L(SF*1.04)],
    [DUR,          L(SF)],
  ]);
}
function camTarget(t) {
  t = clamp(t, 0, DUR);
  const [fl, tr, sh] = LEGS;
  // flight: hold the wide frame while the plane flies into it, then ride along.
  // smooth max() keeps the pan direction one-way (no swing back toward Seoul).
  const pf = along(fl, legU(fl, t));
  const k = 1.2, dxp = pf.x - CW.x, root = Math.sqrt(dxp*dxp + k*k);
  let x = (CW.x + pf.x + root) / 2;
  let y = lerp(CW.y, pf.y, (1 + dxp/root) / 2);
  // Kansai: frame Osaka–Kyoto and drift along with the train
  const pt = along(tr, legU(tr, t));
  const wk = sstep(t, fl.t1 - 0.45, tr.t0 + 0.25);
  x = lerp(x, lerp(KC.x, pt.x, 0.4), wk); y = lerp(y, lerp(KC.y, pt.y, 0.4), wk);
  // shinkansen: loose tracking so the train visibly races across the frame
  const ps = along(sh, legU(sh, t));
  const ws = sstep(t, sh.t0 - 0.7, sh.t0 + 0.6);
  x = lerp(x, lerp(ps.x, SM.x, 0.45), ws); y = lerp(y, lerp(ps.y, SM.y, 0.45), ws);
  // overview: pan progress follows (and never leads) zoom progress → nothing overshoots its final spot
  const tA = sh.t1 - 0.25, zA = zCurve(tA);
  const zp = t <= tA ? 0 : clamp((zA - zCurve(t)) / (zA - Math.log(SF)), 0, 1);
  const wF = zp * zp * (2 - zp);
  x = lerp(x, CF.x, wF); y = lerp(y, CF.y, wF);
  return [x, y, zCurve(t)];
}
function buildCamera() {
  buildZoom();
  const HZ = 120, PAD = 2, n = Math.ceil((DUR + 2*PAD) * HZ) + 1;
  const raw = [new Float64Array(n), new Float64Array(n), new Float64Array(n)];
  for (let i = 0; i < n; i++) { const c = camTarget(-PAD + i/HZ); raw[0][i] = c[0]; raw[1][i] = c[1]; raw[2][i] = c[2]; }
  const sig = CAM.smooth * HZ, R = Math.ceil(sig * 3), ker = [];
  let ks = 0; for (let k = -R; k <= R; k++) { const v = Math.exp(-k*k/(2*sig*sig)); ker.push(v); ks += v; }
  const out = raw.map(a => {
    const o = new Float64Array(n);
    for (let i = 0; i < n; i++) { let s = 0;
      for (let k = -R; k <= R; k++) s += a[clamp(i + k, 0, n - 1)] * ker[k + R];
      o[i] = s / ks; }
    return o;
  });
  camTrack = { HZ, PAD, n, x: out[0], y: out[1], z: out[2] };
}
function camAt(t) {
  const c = camTrack, f = clamp((t + c.PAD) * c.HZ, 0, c.n - 1.001), i = Math.floor(f), u = f - i;
  return { x: lerp(c.x[i], c.x[i+1], u), y: lerp(c.y[i], c.y[i+1], u), s: Math.exp(lerp(c.z[i], c.z[i+1], u)) };
}
const toScreen = (p, cam) => [(p.x - cam.x)*cam.s + W/2, (p.y - cam.y)*cam.s + H/2];

/* ---------- static overlays ---------- */
function buildVignette() {
  VIGNETTE = document.createElement('canvas'); VIGNETTE.width = W; VIGNETTE.height = H;
  const g = VIGNETTE.getContext('2d');
  let r = g.createRadialGradient(W/2, H*0.47, 260, W/2, H*0.47, H*0.72);
  r.addColorStop(0, 'rgba(3,7,11,0)'); r.addColorStop(1, 'rgba(3,7,11,0.5)');
  g.fillStyle = r; g.fillRect(0, 0, W, H);
  let l = g.createLinearGradient(0, 0, 0, 520);
  l.addColorStop(0, 'rgba(3,7,11,0.55)'); l.addColorStop(1, 'rgba(3,7,11,0)');
  g.fillStyle = l; g.fillRect(0, 0, W, 520);
  l = g.createLinearGradient(0, H - 480, 0, H);
  l.addColorStop(0, 'rgba(3,7,11,0)'); l.addColorStop(1, 'rgba(3,7,11,0.5)');
  g.fillStyle = l; g.fillRect(0, H - 480, W, 480);
}

/* ---------- text helpers ---------- */
function setFont(w, px) { ctx.font = `${w} ${px}px ${FONT}`; }
function spacedW(txt, ls) { let w = 0; for (const ch of txt) w += ctx.measureText(ch).width + ls; return w - ls; }
function fillSpaced(txt, x, y, ls, align = 'center') {
  const w = spacedW(txt, ls);
  let cx = align === 'center' ? x - w/2 : align === 'right' ? x - w : x;
  for (const ch of txt) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + ls; }
  return w;
}
function rr(x, y, w, h, rl, rr_ = rl) { // rounded rect, separate left/right radius
  ctx.beginPath();
  ctx.moveTo(x + rl, y); ctx.lineTo(x + w - rr_, y);
  ctx.arcTo(x + w, y, x + w, y + rr_, rr_); ctx.lineTo(x + w, y + h - rr_);
  ctx.arcTo(x + w, y + h, x + w - rr_, y + h, rr_); ctx.lineTo(x + rl, y + h);
  ctx.arcTo(x, y + h, x, y + h - rl, rl); ctx.lineTo(x, y + rl);
  ctx.arcTo(x, y, x + rl, y, rl); ctx.closePath();
}

/* ---------- map ---------- */
function drawMap(cam) {
  const s = cam.s;
  ctx.setTransform(s, 0, 0, s, W/2 + (ORIGIN.x - cam.x)*s, H/2 + (ORIGIN.y - cam.y)*s);
  const land = s < 150 ? LAND_LO : LAND_HI;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = COLOR.shelf;
  ctx.lineWidth = 18 / s; ctx.stroke(land);
  ctx.lineWidth = 7 / s;  ctx.stroke(land);
  ctx.fillStyle = COLOR.land; ctx.fill(land, 'evenodd');
  ctx.fillStyle = COLOR.sea;  ctx.fill(LAKES, 'evenodd');

/* ---------- routes ---------- */

/* ---------- vehicles ---------- */

  ctx.fillStyle = COLOR.vehicle; ctx.fill();

// top-down airliner, nose → +x, unit length
const PLANE = (() => {

/* ---------- pins ---------- */
const PIN_C = 36, PIN_R = 21, PIN_H = PIN_C + PIN_R;

  if (age < hit) { const q = age / hit; dy = -80*(1 - q*q); a = clamp(q*2.5, 0, 1); }
  else { const q = age - hit, sp = Math.exp(-q*9) * Math.cos(q*24); sy = 1 - 0.2*sp; sx = 1 + 0.14*sp; }

/* ---------- labels: arrival card → compact label ---------- */
function drawCard(st, x, y, k, t) {

  rr(cx - cw/2, top, cw, ch, 22); ctx.fillStyle = COLOR.card; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = COLOR.cardEdge; ctx.lineWidth = 1.5; ctx.stroke();

    () => { setFont(800, 60); ctx.fillStyle = COLOR.ink; fillSpaced(st.name, cx, top + 120, 6); },

/* ---------- HUD: current leg + trip tracker ---------- */

/* ---------- end title ---------- */

/* ---------- frame ---------- */

/* ---------- playback ---------- */
let raf = 0, busy = false;
function stopPlay() { if (raf) cancelAnimationFrame(raf); raf = 0; }
function play() {
  stopPlay();
  const start = performance.now();
  const loop = now => {
    const t = (now - start) / 1000;
    render(Math.min(t, DUR));
    raf = t < DUR ? requestAnimationFrame(loop) : 0;
  };
  raf = requestAnimationFrame(loop);

/* ---------- export: WebCodecs H.264 → MP4 (frame-exact), fallback MediaRecorder ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const yieldUI = () => new Promise(r => { let done = false; const f = () => { if (!done) { done = true; r(); } };
  requestAnimationFrame(f); setTimeout(f, 40); });
const $status = document.getElementById('status');
const setStatus = s => { $status.textContent = s; };

async function pickEncoder(fps) {

  const bitrate = fps >= 50 ? 24e6 : 16e6;
  for (const codec of ['avc1.64002A', 'avc1.640033', 'avc1.4D002A', 'avc1.42002A']) {
    const cfg = { codec, width: W, height: H, bitrate, framerate: fps, avc: { format: 'avc' } };

async function saveVideo() {

  const fps = +document.getElementById('fps').value;

    const cfg = await pickEncoder(fps);
    if (cfg) {
      try { blob = await exportWebCodecs(cfg, fps); }
      catch (e) { console.warn('WebCodecs export failed, using MediaRecorder', e); }
    }
    if (!blob) ({ blob, ext } = await exportRealtime(fps));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `japan-route-5days-1080x1920-${fps}fps.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    setStatus(`저장 완료 · ${(blob.size / 1048576).toFixed(1)}MB ${ext.toUpperCase()}`);
    window.__lastExport = { size: blob.size, ext, fps };
  } catch (e) {
    console.error(e); setStatus('저장 실패: ' + (e && e.message || e));
    window.__lastExport = { error: String(e && e.message || e) };

}
function setUI(lock) { for (const id of ['play', 'save', 'fps']) document.getElementById(id).disabled = lock; }

/* ---------- layout ---------- */
function fit() {
  const still = document.body.classList.contains('still');
  const aw = innerWidth - (still ? 0 : 32), ah = innerHeight - (still ? 0 : 32 + 16 + 44 + 14);
  let h = ah, w = h * 9 / 16;
  if (w > aw) { w = aw; h = w * 16 / 9; }
  const st = document.getElementById('stage'); st.style.width = w + 'px'; st.style.height = h + 'px';
}

/* ---------- boot ---------- */
window.addEventListener('DOMContentLoaded', async () => {
  const q = new URLSearchParams(location.search);
  const still = q.has('t');
  if (still) document.body.classList.add('still');
  fit(); addEventListener('resize', fit);
  try { await Promise.all(['500', '700', '800'].map(w => document.fonts.load(`${w} 40px "Pretendard"`, 'AZ가'))); } catch (e) {}
  buildGeometry(JSON.parse(document.getElementById('mapdata').textContent));
  if (still) { render(parseFloat(q.get('t')) || 0); }
  else {
    document.getElementById('play').onclick = () => { if (!busy) play(); };
    document.getElementById('save').onclick = saveVideo;
    addEventListener('keydown', e => { if (e.code === 'Space' && !busy) { e.preventDefault(); play(); } });
    play();
  }

});
