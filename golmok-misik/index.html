<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>골목미식 — 서울·경기 가이드 맛집 지도</title>
  <meta name="description" content="미쉐린, 블루리본, 생활의 달인, 백년가게에 선정·소개된 서울·경기 식당을 한 지도에서 봅니다.">
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b5462b'/%3E%3Cpath d='M16 6c-4.4 0-8 3.4-8 7.7C8 19.5 16 26 16 26s8-6.5 8-12.3C24 9.4 20.4 6 16 6zm0 10.5a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <a class="skip" href="#list">목록으로 건너뛰기</a>
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M16 6c-4.4 0-8 3.4-8 7.7C8 19.5 16 26 16 26s8-6.5 8-12.3C24 9.4 20.4 6 16 6zm0 10.5a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6z"/></svg>
      <div>
        <h1>골목미식</h1>
        <p class="tagline">서울·경기 가이드 맛집 지도</p>
      </div>
      <button type="button" class="ghost" id="coverageBtn" aria-haspopup="dialog">자료 현황</button>
    </div>
    <form class="controls" id="controls" role="search" onsubmit="return false">
      <label class="search">
        <span class="sr">검색</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
        <input id="q" type="search" placeholder="식당 이름, 메뉴, 동네, 주소" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="region">
        <label><span class="sr">시·도</span>
          <select id="sido"><option value="">서울·경기 전체</option><option value="서울">서울</option><option value="경기">경기</option></select>
        </label>
        <label><span class="sr">시·군·구</span>
          <select id="sigungu" disabled><option value="">시·군·구 전체</option></select>
        </label>
      </div>
      <div class="chips" id="guideChips" role="group" aria-label="가이드 필터(여러 개 선택 가능)"></div>
    </form>
  </header>

  <main class="layout">
    <section class="list-pane" aria-label="식당 목록">
      <p class="count" id="count" aria-live="polite"></p>
      <ol class="cards" id="list"></ol>
      <button type="button" class="more" id="more" hidden>더 보기</button>
      <p class="empty" id="empty" hidden>조건에 맞는 식당이 없습니다. 검색어나 필터를 바꿔 보세요.</p>
    </section>
    <section class="map-pane" aria-label="지도">
      <div id="map" class="map"></div>
      <p class="map-note" id="mapNote" hidden></p>
    </section>
  </main>

  <aside class="detail" id="detail" hidden aria-labelledby="detailName" role="dialog">
    <div class="detail-inner" id="detailBody"></div>
  </aside>

  <dialog id="coverage" aria-labelledby="coverageTitle">
    <div class="dlg-head">
      <h2 id="coverageTitle">자료 현황</h2>
      <button type="button" class="icon" data-close aria-label="닫기">✕</button>
    </div>
    <div id="coverageBody"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
