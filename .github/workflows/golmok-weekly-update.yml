# 골목미식 주간 데이터 갱신 — 매주 화요일 11:00 KST (= 화요일 02:00 UTC)
name: golmok-misik weekly data update

on:
  schedule:
    - cron: '0 2 * * 2'
  workflow_dispatch:
    inputs:
      only:
        description: '특정 출처만 갱신 (예: michelin,lifemaster). 비우면 전체'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: golmok-misik-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: golmok-misik

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 단위 테스트
        run: npm test
      - name: 데이터 갱신(임시 파일 → 검사 → 통과 시 반영)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
          GEOCODE: ${{ vars.GOLMOK_GEOCODE }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            node scripts/update.mjs --only=${{ github.event.inputs.only }}
          else
            node scripts/update.mjs
          fi
      - name: 갱신 보고서
        if: always()
        run: |
          f=data/update-report.json; [ -f data/last-failed-report.json ] && f=data/last-failed-report.json
          node -e "const r=require('./'+process.argv[1]);console.log(JSON.stringify({ok:r.ok,changed:r.changed,sources:r.sources,added:r.added?.length,addressChanged:r.addressChanged,retired:r.retired,errors:r.errors?.slice(0,20)},null,1))" "$f" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 변경 사항 커밋
        id: commit
        run: |
          git config user.name "golmok-misik-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "golmok-misik: 주간 데이터 갱신 $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/golmok-pages.yml
    secrets: inherit
