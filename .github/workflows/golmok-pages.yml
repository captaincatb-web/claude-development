# 골목미식 GitHub Pages 배포. golmok-misik/ 를 정적 사이트로 올린다.
name: golmok-misik pages

on:
  push:
    paths: ['golmok-misik/**', '.github/workflows/golmok-pages.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: golmok-misik-pages
  cancel-in-progress: true

jobs:
  build:
    # 기본 브랜치에서만 배포(주간 갱신에서 호출될 때도 기본 브랜치)
    if: github.ref_name == github.event.repository.default_branch || github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # 주간 갱신이 방금 올린 커밋까지 포함(브랜치 최신)
      - name: 사이트 파일 모으기
        run: |
          cd golmok-misik
          mkdir -p ../_site && cp -r index.html app.js map.js styles.css config.js lib vendor ../_site/
          mkdir -p ../_site/data && cp data/restaurants.json data/meta.json ../_site/data/
      - name: 네이버 지도 Client ID 주입(저장소 변수 NAVER_MAPS_CLIENT_ID)
        env:
          NAVER_MAPS_CLIENT_ID: ${{ vars.NAVER_MAPS_CLIENT_ID }}
        run: |
          if [ -n "$NAVER_MAPS_CLIENT_ID" ]; then
            sed -i "s/naverMapsClientId: ''/naverMapsClientId: '${NAVER_MAPS_CLIENT_ID}'/" _site/config.js
          fi
          grep -n naverMapsClientId _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
