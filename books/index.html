/* 레이아웃: 홈은 품목별 선반에 회사 책등을 꽂은 책장. 책등을 누르면 표지(왼쪽)와 본문 쪽(오른쪽)이 펼쳐진 책 한 권이 열린다. */
:root {
  --bg: #eef1f2; --wall: #e3e8ea; --paper: #fdfdfb; --fg: #18232a; --muted: #5a6a73; --line: #d3dbdf;
  --board: #6b5a4a; --board-edge: #4f4235; --accent: #0b5d72; --accent-soft: #d9ebf0;

  --g1: #1f5f6b; --g2: #7a2e33; --g3: #8a6a1f; --g4: #34507a; --g5: #55602b; --g6: #5e3a66; --g7: #8c4a26; --g8: #3f4a50; --g9: #2f5a3d;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1518; --wall: #141c20; --paper: #182127; --fg: #e3eaee; --muted: #93a3ac; --line: #28363e;
  --board: #5a4a3c; --board-edge: #3a3028; --accent: #62c4dc; --accent-soft: #173039;
  --ok: #7fd49b; --ok-bg: #173325; --mid: #e6bd62; --mid-bg: #382d12; --low: #ee8f99; --low-bg: #3b1a1f;
  --g1: #2a7584; --g2: #93424a; --g3: #9f7f2e; --g4: #456694; --g5: #6a7637; --g6: #74507d; --g7: #a35d35; --g8: #55626a; --g9: #3d7150;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1518; --wall: #141c20; --paper: #182127; --fg: #e3eaee; --muted: #93a3ac; --line: #28363e;
  --board: #5a4a3c; --board-edge: #3a3028; --accent: #62c4dc; --accent-soft: #173039;
  --ok: #7fd49b; --ok-bg: #173325; --mid: #e6bd62; --mid-bg: #382d12; --low: #ee8f99; --low-bg: #3b1a1f;
  --g1: #2a7584; --g2: #93424a; --g3: #9f7f2e; --g4: #456694; --g5: #6a7637; --g6: #74507d; --g7: #a35d35; --g8: #55626a; --g9: #3d7150;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; }
h1 { font-family: var(--serif); font-size: 1.95rem; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.kicker { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
.lede { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
.chip { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 3px; white-space: nowrap; }
.chip.A { background: var(--ok-bg); color: var(--ok); } .chip.B { background: var(--mid-bg); color: var(--mid); } .chip.C { background: var(--low-bg); color: var(--low); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; margin: 8px 0 4px; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 8px; }
.tools input, .tools select { font: inherit; font-size: 14px; color: var(--fg); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 0; }
.tools input { flex: 1 1 220px; }

/* 책장 */
.case { background: var(--wall); border-radius: 6px; padding: 18px 18px 6px; margin-top: 18px; }
.shelf { margin-bottom: 26px; }
.shelf h2 { font-family: var(--serif); font-size: 1.2rem; margin: 0; }
.shelf .cap { font-size: 13.5px; color: var(--muted); margin: 2px 0 10px; max-width: 80ch; }
.row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; padding: 0 6px; min-height: 40px; border-bottom: 12px solid var(--board); box-shadow: 0 3px 0 var(--board-edge); }
.grp { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px; margin-right: 14px; min-width: 0; max-width: 100%; }
.grp-l { writing-mode: vertical-rl; font-size: 11px; letter-spacing: .1em; color: var(--muted); padding: 0 2px 6px; align-self: flex-end; }
.spine { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  width: 44px; padding: 10px 0 8px; border: 0; border-radius: 3px 3px 0 0; color: var(--spine-fg); cursor: pointer; font: inherit;
  box-shadow: inset 3px 0 0 rgba(255,255,255,.14), inset -3px 0 0 rgba(0,0,0,.18); transition: transform .18s ease; }
.spine:hover, .spine:focus-visible { transform: translateY(-8px); }
.spine:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spine .t { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 700; font-size: 14px; letter-spacing: .02em; line-height: 1.1; max-height: 100%; overflow: hidden; }
.spine .i { writing-mode: vertical-rl; font-size: 10.5px; opacity: .85; margin-top: 6px; }
.spine .d { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--spine-fg); margin-top: 8px; flex: none; }
.spine .d.A { background: var(--spine-fg); } .spine .d.B { background: linear-gradient(90deg, var(--spine-fg) 50%, transparent 50%); }
.spine .band { position: absolute; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.35); }
.spine[hidden] { display: none !important; }

/* 펼친 책 */
.bookview { margin-top: 8px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; background: var(--paper); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .4; cursor: default; }
.spacer { flex: 1; }
.book { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); background: var(--paper); border: 1px solid var(--line); border-radius: 4px 8px 8px 4px; box-shadow: 0 10px 30px rgba(0,0,0,.08); min-height: 560px; }
.cover { position: relative; color: var(--spine-fg); padding: 36px 30px; border-radius: 4px 0 0 4px; display: flex; flex-direction: column; gap: 14px; }
.cover::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 14px; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.22)); }
.cover .series { font-size: 12px; letter-spacing: .1em; opacity: .85; }
.cover h2 { font-family: var(--serif); font-size: 2rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.cover .item { font-size: 15px; border-top: 1px solid rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.4); padding: 6px 0; }
.cover .one { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; opacity: .95; }
.cover .head { font-size: 13.5px; opacity: .85; margin-top: -6px; }
.cover .topics { display: flex; flex-wrap: wrap; gap: 6px; }
.cover .topics span { font-size: 12px; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 1px 10px; }
.spine .code { font-size: 9.5px; letter-spacing: .04em; opacity: .8; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
ul.rel { list-style: none; margin-left: 0; }
ul.rel li { margin-bottom: 6px; }
ul.rel a { text-decoration: none; }
.cover .foot { margin-top: auto; font-size: 12.5px; opacity: .85; }
.cover .conf { display: inline-block; background: rgba(255,255,255,.18); padding: 2px 8px; border-radius: 3px; font-weight: 600; }
.leaf { padding: 30px 34px 22px; display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 18px; font-size: 13.5px; }
.tabs button { font: inherit; background: none; border: 0; padding: 2px 0; color: var(--muted); cursor: pointer; }
.tabs button[aria-current="page"] { color: var(--fg); font-weight: 600; box-shadow: 0 2px 0 var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page { flex: 1; min-width: 0; }
.page.fwd { animation: turnF .32s ease; }
.page.back { animation: turnB .32s ease; }
@keyframes turnF { from { opacity: 0; transform: translateX(28px) rotateY(-8deg); } to { opacity: 1; transform: none; } }
@keyframes turnB { from { opacity: 0; transform: translateX(-28px) rotateY(8deg); } to { opacity: 1; transform: none; } }
/* 책 꺼내기 → 펼치기 → 다시 꽂기 */
.spine.pulling { z-index: 2; animation: pull .42s cubic-bezier(.3,.6,.2,1) forwards; }
@keyframes pull { 0% { transform: translateY(-8px); } 45% { transform: translateY(-46px) rotate(-3deg); } 100% { transform: translateY(-60px) rotate(-6deg) scale(1.25); opacity: 0; } }
.spine.returning { animation: putback .55s cubic-bezier(.2,.8,.2,1); }
@keyframes putback { 0% { transform: translateY(-60px) rotate(-5deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.book { perspective: 1800px; }
.book.opening { animation: rise .35s ease both; }
.book.opening .cover { transform-origin: left center; animation: grow .45s cubic-bezier(.2,.7,.2,1) both; }
.book.opening .leaf { transform-origin: left center; animation: unfold .7s .2s cubic-bezier(.2,.75,.2,1) both; }
.book.opening .cover > * { animation: fadeUp .4s .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(.12); } to { transform: none; } }
@keyframes unfold { from { transform: rotateY(-100deg); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .book.opening .cover { transform-origin: center top; animation-name: growY; }
  .book.opening .leaf { transform-origin: center top; animation-name: unfoldY; }
  @keyframes growY { from { transform: scaleY(.15); } to { transform: none; } }
  @keyframes unfoldY { from { transform: rotateX(80deg); opacity: .2; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) {
  .page.fwd, .page.back, .spine.pulling, .spine.returning, .book.opening, .book.opening .cover, .book.opening .leaf, .book.opening .cover > * { animation: none; }
  .spine { transition: none; }
}
.page h3 { font-family: var(--serif); font-size: 1.25rem; margin: 0 0 10px; }
.page p { margin: 0 0 10px; max-width: 64ch; }
.page ul { margin: 0 0 12px 18px; padding: 0; max-width: 64ch; }
.page li { margin-bottom: 4px; }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 4px 0 14px; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }
.sub-t { margin: -4px 0 10px; color: var(--muted); font-size: 14.5px; letter-spacing: .02em; }
.sec-t { font-family: var(--serif); font-size: 1.3rem; margin: 26px 0 2px; }
.lvrow { display: grid; grid-template-columns: 52px 1fr; gap: 10px; margin: 12px 0; align-items: start; }
.lv { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 3px; margin-right: 8px; vertical-align: 2px; background: var(--ok-bg); color: var(--ok); }
.lv.실무 { background: var(--mid-bg); color: var(--mid); } .lv.심화 { background: var(--low-bg); color: var(--low); }
.lvrow > .lv { margin-top: 10px; text-align: center; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; min-width: 0; }
.pcard { display: grid; gap: 3px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--fg); position: relative; }
.pcard:hover, .pcard:focus-visible { border-color: var(--accent); outline: none; }
.pcard .pn { position: absolute; right: 12px; top: 10px; color: var(--muted); font-size: 12px; }
.pcard small { color: var(--muted); font-size: 12px; } .pcard span:not(.pn) { font-size: 13.5px; line-height: 1.5; }
.pcard em { font-style: normal; font-size: 12px; color: var(--accent); }
.kchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.kchip { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--fg); background: var(--paper); }

.tsec { border-top: 1px solid var(--line); padding: 12px 0 4px; max-width: 900px; } .tsec h3 { font-size: 1.05rem; margin: 0 0 8px; }
.tsec p, .tsec li { max-width: 72ch; }

.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } .tri.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tri b { font-size: 13px; color: var(--accent); } .tri ul { margin: 4px 0 0; padding-left: 1.1em; font-size: 14px; }

.empty { color: var(--muted); font-style: italic; }
.src li { font-size: 13.5px; }
/* 조밀한 배치: 리포트는 넓은 화면에서 2열, 표지 그림, 즐겨찾기, 보기 전환, 공정 지도 */
.reps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 18px; }
.rep { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 0; min-width: 0; font-size: 14px; line-height: 1.6; }

.stage { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 12px 10px; min-width: 0; position: relative; }
.stage.infra { margin-top: 10px; background: var(--wall); }
.st-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.st-h b { font-family: var(--serif); font-size: 1.05rem; }
.st-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--paper); font-size: 12px; font-weight: 700; flex: none; }
.st-en { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); }
.stage p { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 3px 8px; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--spine-fg); background: var(--c); }
.mchip small { font-weight: 400; opacity: .8; font-size: 11px; }
.mchip .d { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--spine-fg); flex: none; }

.rep-h .tp { color: var(--fg); background: var(--accent-soft); padding: 0 6px; border-radius: 3px; }
.rep ul { margin-bottom: 4px; }

.folio { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  var NOTE = '<p class="note">일반 기술 해설입니다. 공정 원리는 교과서 수준의 내용이고, 대표 기업은 널리 알려진 업체 예시로 점유율이나 순위가 아닙니다. 수치가 필요한 판단에는 회사 책의 출처 자료를 쓰세요.</p>';
  function renderTech() {
    var h = head('<p class="lede">공정 13개와 제품 기술 ' + Object.keys(TX).length + '개를 설명합니다. 입문에서 심화 순서로 읽으면 반도체 제조 흐름이 잡히고, 각 항목에서 관련 소재·부품과 서재 속 회사 책으로 이어집니다.</p>') + viewTabs("tech");
    h += '<h2 class="sec-t">공정 백과</h2><p class="cap">학습 경로: 입문 → 실무 → 심화</p>';
    LV.forEach(function (lv) {
      h += '<div class="lvrow"><span class="lv ' + lv + '">' + lv + '</span><div class="pgrid">';
      PROC.forEach(function (p, k) {
        if (p.lv !== lv) return;
        h += '<a class="pcard" href="#t-' + p.id + '"><span class="pn">' + (k + 1) + '</span><b>' + esc(p.n) + '</b><small>' + esc(p.en) + '</small><span>' + esc(p.s) + '</span><em>회사 ' + firmsOf(p.tx).length + "곳</em></a>";
      });
      h += "</div></div>";
    });
    h += '<h2 class="sec-t">제품 기술</h2><p class="cap">서재 속 회사들이 만드는 품목입니다. 누르면 원리와 만드는 회사가 나옵니다.</p><div class="kchips">' + Object.keys(TX).map(txLink).join("") + "</div>";
    app.innerHTML = h;
  }
  function sec(lv, title, body) { return '<section class="tsec"><h3><span class="lv ' + lv + '">' + lv + "</span>" + esc(title) + "</h3>" + body + "</section>"; }
  function renderProc(p) {
    var k = PROC.indexOf(p), firms = firmsOf(p.tx), prev = PROC[k - 1], next = PROC[k + 1];
    var h = head("") + viewTabs("tech") + '<p class="crumb"><a href="#tech">기술 백과</a> › 공정 ' + (k + 1) + "</p>" +
      '<h2 class="ttl">' + esc(p.n) + ' <small>' + esc(p.en) + "</small></h2>" + NOTE;
    h += sec("입문", "한눈에", "<p>" + esc(p.s) + "</p>") + sec("입문", "왜 필요한가", "<p>" + esc(p.why) + "</p>");
    h += sec("실무", "작동 원리와 흐름", '<ol class="steps">' + p.how.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>");
    h += sec("실무", "장비 · 소재 · 부품", '<div class="tri"><div><b>주요 장비</b>' + list(p.eq) + "</div><div><b>핵심 소재</b>" + list(p.mat) + "</div><div><b>핵심 부품</b>" + list(p.part) + "</div></div>");
    h += sec("심화", "기술 이슈", list(p.iss)) + sec("심화", "발전 방향", list(p.fut));
    h += sec("실무", "대표 기업", '<div class="tri two"><div><b>해외</b>' + list(p.gl) + "</div><div><b>국내</b>" + list(p.kr) + "</div></div>");
    h += sec("실무", "서재 속 관련 회사", firms.length ? '<div class="chips">' + firms.map(chip).join("") + "</div>" : '<p class="empty">이 서재에 이 공정 품목을 만드는 회사가 없습니다.</p>');
    if (p.tx.length) h += sec("실무", "관련 제품 기술", '<div class="kchips">' + p.tx.map(txLink).join("") + "</div>");
    h += sec("심화", "더 읽기", sbList(p.sb));
    h += '<nav class="pnav">' + (prev ? '<a href="#t-' + prev.id + '">← ' + esc(prev.n) + "</a>" : "<span></span>") + (next ? '<a href="#t-' + next.id + '">' + esc(next.n) + " →</a>" : "") + "</nav>";
    app.innerHTML = h;
  }
  function txBody(x) {
    return '<p><b>무엇인가</b> ' + esc(x.w) + '</p><p><b>원리</b> ' + esc(x.h) + '</p><p><b>공정 위치</b> ' + esc(x.p) + '</p><p><b>핵심 기술</b></p>' + list(x.k) + '<p class="txr"><b>트렌드</b> ' + esc(x.r) + "</p>";
  }
  function renderTx(key) {
    var x = TX[key], firms = firmsOf([key]);
    var h = head("") + viewTabs("tech") + '<p class="crumb"><a href="#tech">기술 백과</a> › 제품 기술</p><h2 class="ttl">' + esc(x.t) + "</h2>" + NOTE +
      '<div class="txc">' + txBody(x) + "</div>" +
      sec("실무", "쓰이는 공정", '<div class="kchips">' + (procOf[key] || []).map(pLink).join("") + "</div>") +
      sec("실무", "서재 속 만드는 회사", firms.length ? '<div class="chips">' + firms.map(chip).join("") + "</div>" : '<p class="empty">없음</p>');
    app.innerHTML = h;
  }
  /* 통합 검색 색인: 공정·제품 기술 */
  function hitText(o) { return JSON.stringify(o).toLowerCase(); }
  function searchKnow(v) {
    var out = [];
    PROC.forEach(function (p) { if (hitText(p).indexOf(v) >= 0) out.push('<a class="kchip p" href="#t-' + p.id + '">공정 · ' + esc(p.n) + "</a>"); });
    Object.keys(TX).forEach(function (k) { if (hitText(TX[k]).indexOf(v) >= 0) out.push('<a class="kchip" href="#x-' + k + '">기술 · ' + esc(TX[k].t) + "</a>"); });
    return out;
  }
  function route() {
    var m = /^#b(\d+)$/.exec(location.hash);
    if (m && B[+m[1]]) {
      var i = +m[1];
      if (i !== cur.i || view !== "book") { cur.p = 0; opening = true; }
      cur.i = i; view = "book"; renderBook(); window.scrollTo(0, 0);
    } else if (location.hash === "#tech" || /^#[tx]-/.test(location.hash)) {
      var h2 = location.hash, pp = h2.indexOf("#t-") === 0 ? procById(h2.slice(3)) : null, xk = h2.indexOf("#x-") === 0 && TX[h2.slice(3)] ? h2.slice(3) : null;
      view = "tech"; if (pp) renderProc(pp); else if (xk) renderTx(xk); else renderTech(); window.scrollTo(0, 0);
    } else if (location.hash === "#map") {
      homeView = "map"; view = "map"; renderMap(); window.scrollTo(0, 0);
    } else {
      if (view === "book") lastBook = cur.i;
      homeView = "shelf"; view = "shelf"; renderShelf();
    }
  }
  window.addEventListener("scroll", function () { if (!location.hash) { try { sessionStorage.setItem("shelfY", String(window.scrollY)); } catch (e) {} } });
  window.addEventListener("hashchange", route);
  document.addEventListener("keydown", function (e) {
    if (!/^#b\d+$/.test(location.hash) || /input|select|textarea/i.test(e.target.tagName)) return;
    var P = pagesOf(B[cur.i]);
    if (e.key === "ArrowRight" && cur.p < P.length - 1) turn(cur.p + 1);
    if (e.key === "ArrowLeft" && cur.p > 0) turn(cur.p - 1);
    if (e.key === "Escape") location.hash = "";
  });
  route();
})();
</script>

</body>
</html>
