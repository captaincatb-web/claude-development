<title>충청권 반도체 협력사 기술조사서</title>

/* 레이아웃: 홈은 품목별 선반에 회사 책등을 꽂은 책장. 책등을 누르면 표지(왼쪽)와 본문 쪽(오른쪽)이 펼쳐진 책 한 권이 열린다. */
:root {
  --bg: #eef1f2; --wall: #e3e8ea; --paper: #fdfdfb; --fg: #18232a; --muted: #5a6a73; --line: #d3dbdf;
  --board: #6b5a4a; --board-edge: #4f4235; --accent: #0b5d72; --accent-soft: #d9ebf0;
  --ok: #1d6b3a; --ok-bg: #dff1e5; --mid: #8a5a00; --mid-bg: #f7ead0; --low: #8c2f39; --low-bg: #f5dfe1;
  --g1: #1f5f6b; --g2: #7a2e33; --g3: #8a6a1f; --g4: #34507a; --g5: #55602b; --g6: #5e3a66; --g7: #8c4a26; --g8: #3f4a50; --g9: #2f5a3d;
  --spine-fg: #fbf8f1;
  --serif: "Noto Serif KR", Georgia, serif; --sans: "IBM Plex Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1518; --wall: #141c20; --paper: #182127; --fg: #e3eaee; --muted: #93a3ac; --line: #28363e;
  --board: #5a4a3c; --board-edge: #3a3028; --accent: #62c4dc; --accent-soft: #173039;
  --ok: #7fd49b; --ok-bg: #173325; --mid: #e6bd62; --mid-bg: #382d12; --low: #ee8f99; --low-bg: #3b1a1f;
  --g1: #2a7584; --g2: #93424a; --g3: #9f7f2e; --g4: #456694; --g5: #6a7637; --g6: #74507d; --g7: #a35d35; --g8: #55626a; --g9: #3d7150;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1518; --wall: #141c20; --paper: #182127; --fg: #e3eaee; --muted: #93a3ac; --line: #28363e;
  --board: #5a4a3c; --board-edge: #3a3028; --accent: #62c4dc; --accent-soft: #173039;
  --ok: #7fd49b; --ok-bg: #173325; --mid: #e6bd62; --mid-bg: #382d12; --low: #ee8f99; --low-bg: #3b1a1f;
  --g1: #2a7584; --g2: #93424a; --g3: #9f7f2e; --g4: #456694; --g5: #6a7637; --g6: #74507d; --g7: #a35d35; --g8: #55626a; --g9: #3d7150;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; }
h1 { font-family: var(--serif); font-size: 1.95rem; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.kicker { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
.lede { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
.chip { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 3px; white-space: nowrap; }
.chip.A { background: var(--ok-bg); color: var(--ok); } .chip.B { background: var(--mid-bg); color: var(--mid); } .chip.C { background: var(--low-bg); color: var(--low); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; margin: 8px 0 4px; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 8px; }
.tools input, .tools select { font: inherit; font-size: 14px; color: var(--fg); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 0; }
.tools input { flex: 1 1 220px; }

/* 책장 */
.case { background: var(--wall); border-radius: 6px; padding: 18px 18px 6px; margin-top: 18px; }
.shelf { margin-bottom: 26px; }
.shelf h2 { font-family: var(--serif); font-size: 1.2rem; margin: 0; }
.shelf .cap { font-size: 13.5px; color: var(--muted); margin: 2px 0 10px; max-width: 80ch; }
.row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; padding: 0 6px; min-height: 40px; border-bottom: 12px solid var(--board); box-shadow: 0 3px 0 var(--board-edge); }
.grp { display: flex; align-items: flex-end; gap: 3px; margin-right: 14px; }
.grp-l { writing-mode: vertical-rl; font-size: 11px; letter-spacing: .1em; color: var(--muted); padding: 0 2px 6px; align-self: flex-end; }
.spine { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  width: 44px; padding: 10px 0 8px; border: 0; border-radius: 3px 3px 0 0; color: var(--spine-fg); cursor: pointer; font: inherit;
  box-shadow: inset 3px 0 0 rgba(255,255,255,.14), inset -3px 0 0 rgba(0,0,0,.18); transition: transform .18s ease; }
.spine:hover, .spine:focus-visible { transform: translateY(-8px); }
.spine:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spine .t { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 700; font-size: 14px; letter-spacing: .02em; line-height: 1.1; max-height: 100%; overflow: hidden; }
.spine .i { writing-mode: vertical-rl; font-size: 10.5px; opacity: .85; margin-top: 6px; }
.spine .d { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--spine-fg); margin-top: 8px; flex: none; }
.spine .d.A { background: var(--spine-fg); } .spine .d.B { background: linear-gradient(90deg, var(--spine-fg) 50%, transparent 50%); }
.spine .band { position: absolute; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.35); }
.spine[hidden] { display: none !important; }

/* 펼친 책 */
.bookview { margin-top: 8px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; background: var(--paper); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .4; cursor: default; }
.spacer { flex: 1; }
.book { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); background: var(--paper); border: 1px solid var(--line); border-radius: 4px 8px 8px 4px; box-shadow: 0 10px 30px rgba(0,0,0,.08); min-height: 560px; }
.cover { position: relative; color: var(--spine-fg); padding: 36px 30px; border-radius: 4px 0 0 4px; display: flex; flex-direction: column; gap: 14px; }
.cover::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 14px; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.22)); }
.cover .series { font-size: 12px; letter-spacing: .1em; opacity: .85; }
.cover h2 { font-family: var(--serif); font-size: 2rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.cover .item { font-size: 15px; border-top: 1px solid rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.4); padding: 6px 0; }
.cover .one { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; opacity: .95; }
.cover .head { font-size: 13.5px; opacity: .85; margin-top: -6px; }
.cover .topics { display: flex; flex-wrap: wrap; gap: 6px; }
.cover .topics span { font-size: 12px; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 1px 10px; }
.spine .code { font-size: 9.5px; letter-spacing: .04em; opacity: .8; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
ul.rel { list-style: none; margin-left: 0; }
ul.rel li { margin-bottom: 6px; }
ul.rel a { text-decoration: none; }
.cover .foot { margin-top: auto; font-size: 12.5px; opacity: .85; }
.cover .conf { display: inline-block; background: rgba(255,255,255,.18); padding: 2px 8px; border-radius: 3px; font-weight: 600; }
.leaf { padding: 30px 34px 22px; display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 18px; font-size: 13.5px; }
.tabs button { font: inherit; background: none; border: 0; padding: 2px 0; color: var(--muted); cursor: pointer; }
.tabs button[aria-current="page"] { color: var(--fg); font-weight: 600; box-shadow: 0 2px 0 var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page { flex: 1; min-width: 0; }
.page.fwd { animation: turnF .32s ease; }
.page.back { animation: turnB .32s ease; }
@keyframes turnF { from { opacity: 0; transform: translateX(28px) rotateY(-8deg); } to { opacity: 1; transform: none; } }
@keyframes turnB { from { opacity: 0; transform: translateX(-28px) rotateY(8deg); } to { opacity: 1; transform: none; } }
/* 책 꺼내기 → 펼치기 → 다시 꽂기 */
.spine.pulling { z-index: 2; animation: pull .42s cubic-bezier(.3,.6,.2,1) forwards; }
@keyframes pull { 0% { transform: translateY(-8px); } 45% { transform: translateY(-46px) rotate(-3deg); } 100% { transform: translateY(-60px) rotate(-6deg) scale(1.25); opacity: 0; } }
.spine.returning { animation: putback .55s cubic-bezier(.2,.8,.2,1); }
@keyframes putback { 0% { transform: translateY(-60px) rotate(-5deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.book { perspective: 1800px; }
.book.opening { animation: rise .35s ease both; }
.book.opening .cover { transform-origin: left center; animation: grow .45s cubic-bezier(.2,.7,.2,1) both; }
.book.opening .leaf { transform-origin: left center; animation: unfold .7s .2s cubic-bezier(.2,.75,.2,1) both; }
.book.opening .cover > * { animation: fadeUp .4s .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(.12); } to { transform: none; } }
@keyframes unfold { from { transform: rotateY(-100deg); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .book.opening .cover { transform-origin: center top; animation-name: growY; }
  .book.opening .leaf { transform-origin: center top; animation-name: unfoldY; }
  @keyframes growY { from { transform: scaleY(.15); } to { transform: none; } }
  @keyframes unfoldY { from { transform: rotateX(80deg); opacity: .2; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) {
  .page.fwd, .page.back, .spine.pulling, .spine.returning, .book.opening, .book.opening .cover, .book.opening .leaf, .book.opening .cover > * { animation: none; }
  .spine { transition: none; }
}
.page h3 { font-family: var(--serif); font-size: 1.25rem; margin: 0 0 10px; }
.page p { margin: 0 0 10px; max-width: 64ch; }
.page ul { margin: 0 0 12px 18px; padding: 0; max-width: 64ch; }
.page li { margin-bottom: 4px; }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 4px 0 14px; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }
.ctx { background: var(--accent-soft); border-radius: 4px; padding: 10px 14px; font-size: 14px; margin: 0 0 12px; max-width: 64ch; }
.empty { color: var(--muted); font-style: italic; }
.src li { font-size: 13.5px; }
/* 조밀한 배치: 리포트는 넓은 화면에서 2열, 표지 그림, 즐겨찾기, 보기 전환, 공정 지도 */
.reps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 18px; }
.rep { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 0; min-width: 0; font-size: 14px; line-height: 1.6; }
.rep li { margin-bottom: 2px; }
.cover .art { width: 100%; max-width: 320px; height: auto; color: #fff; margin-top: 4px; opacity: .92; }
.book.opening .cover .art { animation: fadeUp .6s .5s ease both; }
.spine .star { font-size: 11px; line-height: 1; margin-bottom: 4px; }
.btn.fav[aria-pressed="true"] { border-color: var(--mid); color: var(--mid); }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 6px 0 0; }
.views a { padding: 6px 14px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; background: var(--paper); }
.views a[aria-current="page"] { background: var(--accent); color: var(--paper); }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 16px; counter-reset: st; }
.stage { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 12px 10px; min-width: 0; position: relative; }
.stage.infra { margin-top: 10px; background: var(--wall); }
.st-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.st-h b { font-family: var(--serif); font-size: 1.05rem; }
.st-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--paper); font-size: 12px; font-weight: 700; flex: none; }
.st-en { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); }
.stage p { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 3px 8px; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--spine-fg); background: var(--c); }
.mchip small { font-weight: 400; opacity: .8; font-size: 11px; }
.mchip .d { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--spine-fg); flex: none; }
.mchip .d.A { background: var(--spine-fg); } .mchip .d.B { background: linear-gradient(90deg, var(--spine-fg) 50%, transparent 50%); }
.mchip:hover, .mchip:focus-visible { filter: brightness(1.12); outline: 2px solid var(--accent); outline-offset: 1px; }
.rep-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 14px; margin-bottom: 4px; }
.rep-h span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.rep-h .tp { color: var(--fg); background: var(--accent-soft); padding: 0 6px; border-radius: 3px; }
.rep ul { margin-bottom: 4px; }
.rep-s { font-size: 12.5px; }
.folio { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) {
  .book { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .cover { border-radius: 4px 4px 0 0; padding: 24px 20px; }
  .cover::after { display: none; }
  .cover h2 { font-size: 1.6rem; }
  .leaf { padding: 20px 18px 16px; }
  .spine { width: 38px; }
}
</style>

    ["CMP", "Planarization", "쌓은 막을 갈아 평평하게 만드는 단계", ["FNSTech (에프엔에스테크)", "Qnity", "FFEM", "솔브레인"]],
    ["테스트", "Test", "웨이퍼와 패키지에서 불량 칩을 가르는 단계", ["와이씨", "TSE", "피엠티", "엑시콘", "제이티"]],
    ["패키징", "Packaging", "칩을 기판에 올리고 쌓아 완성하는 단계", ["삼성전기", "심텍", "LG화학", "AMMK", "삼화전기"]]
  ];
  var MAP_INFRA = ["팹 인프라·장비 부품", "Fab Infra & Parts", "전 공정을 떠받치는 가스·초순수·진공·물류와 장비 소모 부품",
    ["에어리퀴드코리아", "에어프로덕츠코리아", "쿠리타한수", "EDWARDS", "세메스", "디에스테크노", "영신쿼츠", "와이컴", "이노레스", "GT", "한솔아이원스", "거성"]];

  /* 즐겨찾기: 이 브라우저에만 저장 */
  var FKEY = "semiPartners:fav:v1", fav = {};
  try { (JSON.parse(localStorage.getItem(FKEY) || "[]") || []).forEach(function (n) { fav[n] = 1; }); } catch (e) {}
  function saveFav() { try { localStorage.setItem(FKEY, JSON.stringify(Object.keys(fav))); } catch (e) {} }

  var groupOf = {}, shelfOf = {};
  shelves.forEach(function (s) { s.groups.forEach(function (g) { groupOf[g.id] = g; shelfOf[g.id] = s; }); });
  var order = [];
  shelves.forEach(function (s) { s.groups.forEach(function (g) { B.forEach(function (b, i) { if (b.g === g.id) order.push(i); }); }); });
  var chips = { A: "자료 확인", B: "부분 확인", C: "미검증" };
  var app = document.getElementById("app");
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
  function list(a) { return a && a.length ? "<ul>" + a.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : ""; }

  /* 책장 */
  function renderShelf() {
    var cnt = { A: 0, B: 0, C: 0 };
    B.forEach(function (b) { if (!b.ref) cnt[b.conf]++; });
    var h = '<div class="kicker">기술조사서 · 2026.10.31 기준</div><h1>충청권 반도체 협력사 기술조사서</h1>' +
      '<p class="lede">협력사 46행(중복 1곳 제외 45개 사)을 품목별 책장에 꽂았습니다. 책등을 누르면 회사 한 권이 열립니다.</p>' +
      '<div class="legend"><span><span class="chip A">자료 확인</span> ' + cnt.A + '개 사</span><span><span class="chip B">부분 확인</span> ' + cnt.B + '개 사</span><span><span class="chip C">미검증</span> ' + cnt.C + '개 사</span><span style="color:var(--muted)">책등의 점: 꽉 참 = 확인, 반 = 부분, 빈 원 = 미검증</span></div>' +
      viewTabs("shelf") +
      '<div class="tools"><input id="q" type="search" placeholder="회사명·지역·품목으로 찾기" aria-label="책 찾기"><select id="fc" aria-label="신뢰도"><option value="">신뢰도 전체</option><option value="A">자료 확인</option><option value="B">부분 확인</option><option value="C">미검증</option><option value="F">★ 즐겨찾기만</option></select></div>' +
      '<div class="case">';
    shelves.forEach(function (s) {
      h += '<section class="shelf"><h2>' + esc(s.name) + '</h2><p class="cap">' + esc(s.cap) + '</p><div class="row">';
      s.groups.forEach(function (g) {
        h += '<div class="grp"><span class="grp-l">' + esc(g.name) + '</span>';
        B.forEach(function (b, i) {
          if (b.g !== g.id) return;
          var pages = (b.tech.length + b.mkt.length + b.facts.length + b.watch.length);
          var ht = 150 + Math.min(pages, 14) * 7;
          h += '<button class="spine" type="button" data-i="' + i + '" data-q="' + esc((b.n + " " + b.reg + " " + b.item).toLowerCase()) + '" data-c="' + b.conf + '" style="height:' + ht + 'px;background:var(' + g.c + ')" aria-label="' + esc(b.n + ", " + b.item + ", " + chips[b.conf]) + '">' +
            '<span class="band" style="top:6px"></span>' + (fav[b.n] ? '<span class="star" aria-label="즐겨찾기">★</span>' : '') + '<span class="code">' + esc(b.code) + '</span><span class="t">' + esc(b.n.replace(/\s*\(.*\)$/, "")) + '</span><span class="i">' + esc(b.item) + '</span><span class="d ' + b.conf + '"></span><span class="band" style="bottom:22px"></span></button>';
        });
        h += '</div>';
      });
      h += '</div></section>';
    });
    h += '</div>';
    app.innerHTML = h;
    app.querySelectorAll(".spine").forEach(function (el) { el.addEventListener("click", function () {
      if (busy) return;
      if (reduced()) { location.hash = "b" + el.dataset.i; return; }
      busy = true; el.classList.add("pulling");
      setTimeout(function () { busy = false; location.hash = "b" + el.dataset.i; }, 400);
    }); });
    if (lastBook !== null) {
      var back = app.querySelector('.spine[data-i="' + lastBook + '"]');
      if (back && !reduced()) { back.classList.add("returning"); back.addEventListener("animationend", function () { back.classList.remove("returning"); }, { once: true }); }
      if (back) back.focus({ preventScroll: true });
      lastBook = null;
    }
    var q = document.getElementById("q"), fc = document.getElementById("fc");
    function filt() {
      var v = q.value.trim().toLowerCase(), c = fc.value;
      app.querySelectorAll(".spine").forEach(function (el) { var n = B[+el.dataset.i].n; el.hidden = !!((v && el.dataset.q.indexOf(v) < 0) || (c === "F" ? !fav[n] : (c && el.dataset.c !== c))); });
    }
    q.addEventListener("input", filt); fc.addEventListener("change", filt);
    try { var st = sessionStorage.getItem("shelfY"); if (st) window.scrollTo(0, +st); } catch (e) {}
  }

  function viewTabs(cur) {
    return '<nav class="views" aria-label="보기 전환"><a href="#"' + (cur === "shelf" ? ' aria-current="page"' : "") + '>책장</a><a href="#map"' + (cur === "map" ? ' aria-current="page"' : "") + '>공정 지도</a></nav>';
  }
  function idxOf(name) { for (var k = 0; k < B.length; k++) if (B[k].n === name && !B[k].ref) return k; return -1; }
  function chip(name) {
    var i = idxOf(name); if (i < 0) return "";
    var b = B[i], g = groupOf[b.g];
    return '<a class="mchip" href="#b' + i + '" style="--c:var(' + g.c + ')"><span class="d ' + b.conf + '"></span>' + esc(b.n.replace(/\s*\(.*\)$/, "")) + '<small>' + esc(b.item) + "</small></a>";
  }
  function renderMap() {
    var h = '<div class="kicker">기술조사서 · 2026.10.31 기준</div><h1>충청권 반도체 협력사 기술조사서</h1>' +
      '<p class="lede">협력사를 반도체 공정 순서에 놓았습니다. 한 회사가 여러 단계에 걸치면 각 단계에 모두 표시했습니다. 이름을 누르면 그 회사 책이 열립니다.</p>' + viewTabs("map") +
      '<div class="flow">';
    MAP.forEach(function (st, k) {
      h += '<section class="stage"><div class="st-h"><span class="st-n">' + (k + 1) + '</span><b>' + esc(st[0]) + '</b><span class="st-en">' + esc(st[1]) + '</span></div><p>' + esc(st[2]) + '</p><div class="chips">' + st[3].map(chip).join("") + "</div></section>";
    });
    h += '</div><section class="stage infra"><div class="st-h"><span class="st-n">∞</span><b>' + esc(MAP_INFRA[0]) + '</b><span class="st-en">' + esc(MAP_INFRA[1]) + '</span></div><p>' + esc(MAP_INFRA[2]) + '</p><div class="chips">' + MAP_INFRA[3].map(chip).join("") + "</div></section>";
    app.innerHTML = h;
  }

  /* 펼친 책 */
  var homeView = "shelf";
  var cur = { i: 0, p: 0 }, view = "", opening = false, dir = "", busy = false, lastBook = null;
  function reduced() { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } }
  function turn(p) { dir = p > cur.p ? "fwd" : "back"; cur.p = p; renderBook(); }
  function pagesOf(b) {
    var g = groupOf[b.g], refBook = null;
    if (b.ref) B.forEach(function (x, k) { if (x.n === b.ref) refBook = k; });
    var P = [];
    var ov = "<h3>회사 개요</h3><p>" + esc(b.one) + "</p>";
    if (b.facts.length) ov += '<dl class="facts">' + b.facts.map(function (f) { return "<dt>" + esc(f[0]) + "</dt><dd>" + esc(f[1]) + "</dd>"; }).join("") + "</dl>";
    else ov += '<p class="empty">이번 조사에서 회사 기본 정보를 확인하지 못했습니다.</p>';
    ov += '<dl class="facts"><dt>목록상 지역</dt><dd>' + esc(b.reg) + '</dd><dt>목록상 품목</dt><dd>' + esc(b.item) + '</dd><dt>신뢰도</dt><dd><span class="chip ' + b.conf + '">' + chips[b.conf] + '</span></dd></dl>';
    if (refBook !== null) ov += '<p><a href="#b' + refBook + '">' + esc(b.ref) + ' 책에서 전체 내용 보기</a></p>';
    var gx = GX[b.g];
    ov += '<h3>함께 읽을 교과서</h3><p class="empty" style="font-style:normal">품목의 공정 원리를 설명하는 SemiBooks 교과서입니다.</p><ul class="rel">' +
      gx.rel.map(function (c) { var s = SB[c]; return '<li><a href="' + s[2] + '" target="_blank" rel="noopener"><b>' + esc(s[0]) + '</b> · ' + esc(s[1]) + "</a></li>"; }).join("") + "</ul>";
    P.push(["개요", ov]);
    P.push(["기술·제품", "<h3>기술과 제품</h3>" + (b.tech.length ? list(b.tech) : '<p class="empty">확인된 기술·제품 정보가 없습니다.</p>')]);
    P.push(["시장·경쟁", "<h3>시장과 경쟁</h3>" + (b.mkt.length ? list(b.mkt) : '<p class="empty">이 회사에 대한 시장 정보는 확인하지 못했습니다.</p>') + '<div class="ctx"><b>' + esc(g.name) + ' 품목 배경</b><br>' + esc(g.ctx) + "</div>"]);
    var reps = REP[b.n.replace(/\s*\(.*\)$/, "")] || [];
    var rh = "<h3>증권사·기관 리포트</h3>";
    if (reps.length) {
      rh += '<p class="empty" style="font-style:normal">리포트 원문이나 리포트를 정리한 기사에서 옮긴 요약입니다. 목표가와 추정치는 발간 시점 기준이며 투자 권유가 아닙니다.</p>';
      rh += '<div class="reps">';
      reps.forEach(function (r) {
        var s = S[r.s];
        rh += '<div class="rep"><div class="rep-h"><b>' + esc(r.by) + '</b><span>' + esc(r.date) + '</span><span class="tp">' + esc(r.tp) + '</span></div>' + list(r.pts) +
          (s ? '<a class="rep-s" href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + "</a>" : "") + "</div>";
      });
      rh += "</div>";
    } else {
      rh += '<p class="empty">찾은 증권사 리포트가 없습니다. 비상장사·외국계 법인이거나 커버리지가 없는 회사입니다.</p>';
    }
    P.push(["리포트", rh]);
    var srcKeys = b.src.slice();
    reps.forEach(function (r) { if (r.s && srcKeys.indexOf(r.s) < 0) srcKeys.push(r.s); });
    var src = srcKeys.map(function (k) { return S[k]; }).filter(Boolean);
    P.push(["확인할 점·출처", "<h3>확인할 점</h3>" + (b.watch.length ? list(b.watch) : '<p class="empty">없음</p>') + "<h3>출처</h3>" + (src.length ? '<ul class="src">' + src.map(function (s) { return '<li><a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + "</a></li>"; }).join("") + "</ul>" : '<p class="empty">근거 자료를 찾지 못했습니다. 이 책의 내용은 일반 지식이나 추정이며 사실로 쓰면 안 됩니다.</p>')]);
    return P;
  }
  function renderBook() {
    var b = B[cur.i], g = groupOf[b.g], s = shelfOf[b.g], P = pagesOf(b);
    if (cur.p >= P.length) cur.p = P.length - 1;
    var pos = order.indexOf(cur.i);
    var h = '<div class="bookview"><div class="bar"><button class="btn" id="home" type="button">← ' + (homeView === "map" ? "공정 지도로" : "책장으로") + '</button>' +
      '<button class="btn fav" id="fav" type="button" aria-pressed="' + (fav[b.n] ? "true" : "false") + '">' + (fav[b.n] ? "★ 즐겨찾기" : "☆ 즐겨찾기") + '</button><span class="spacer"></span>' +
      '<button class="btn" id="pb" type="button"' + (pos <= 0 ? " disabled" : "") + '>이전 책</button>' +
      '<button class="btn" id="nb" type="button"' + (pos >= order.length - 1 ? " disabled" : "") + '>다음 책</button></div>' +
      '<article class="book' + (opening ? " opening" : "") + '" aria-label="' + esc(b.n) + '">' +
      '<div class="cover" style="background:var(' + g.c + ')"><div class="series"><b>' + esc(b.code) + '</b> · ' + esc(s.name + " · " + g.name) + ' · ' + (pos + 1) + ' / ' + order.length + '</div><h2>' + esc(b.n) + '</h2>' +
      '<div class="head">' + esc(GX[b.g].head) + '</div>' +
      '<div class="item">' + esc(b.reg) + ' · ' + esc(b.item) + '</div><div class="one">' + esc(b.one) + '</div>' +
      '<div class="topics">' + GX[b.g].topics.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + '</div>' + coverArt(b) +
      '<div class="foot"><span class="conf">' + chips[b.conf] + '</span><br><br>충청권 반도체 협력사 기술조사서<br>2026.10.31 기준</div></div>' +
      '<div class="leaf"><nav class="tabs" aria-label="이 책의 목차">' + P.map(function (p, k) { return '<button type="button" data-p="' + k + '"' + (k === cur.p ? ' aria-current="page"' : "") + ">" + (k + 1) + ". " + esc(p[0]) + "</button>"; }).join("") + '</nav>' +
      '<div class="page' + (dir ? " " + dir : "") + '" id="pg">' + P[cur.p][1] + '</div>' +
      '<div class="folio"><button class="btn" id="pp" type="button"' + (cur.p === 0 ? " disabled" : "") + '>‹ 앞쪽</button><span>' + (cur.p + 1) + ' / ' + P.length + ' 쪽</span><button class="btn" id="np" type="button"' + (cur.p === P.length - 1 ? " disabled" : "") + '>뒤쪽 ›</button></div></div></article></div>';
    app.innerHTML = h;
    document.getElementById("home").onclick = function () { location.hash = homeView === "map" ? "map" : ""; };
    document.getElementById("fav").onclick = function () { if (fav[b.n]) delete fav[b.n]; else fav[b.n] = 1; saveFav(); var on = !!fav[b.n]; this.setAttribute("aria-pressed", on ? "true" : "false"); this.textContent = on ? "★ 즐겨찾기" : "☆ 즐겨찾기"; };
    document.getElementById("pb").onclick = function () { go(order[pos - 1]); };
    document.getElementById("nb").onclick = function () { go(order[pos + 1]); };
    document.getElementById("pp").onclick = function () { turn(cur.p - 1); };
    document.getElementById("np").onclick = function () { turn(cur.p + 1); };
    app.querySelectorAll(".tabs button").forEach(function (el) { el.onclick = function () { var p = +el.dataset.p; if (p !== cur.p) turn(p); }; });
    opening = false; dir = "";
  }
  function go(i) { location.hash = "b" + i; }
  function route() {
    var m = /^#b(\d+)$/.exec(location.hash);
    if (m && B[+m[1]]) {
      var i = +m[1];
      if (i !== cur.i || view !== "book") { cur.p = 0; opening = true; }
      cur.i = i; view = "book"; renderBook(); window.scrollTo(0, 0);
    } else if (location.hash === "#map") {
      homeView = "map"; view = "map"; renderMap(); window.scrollTo(0, 0);
    } else {
      if (view === "book") lastBook = cur.i;
      homeView = "shelf"; view = "shelf"; renderShelf();
    }
  }
  window.addEventListener("scroll", function () { if (!location.hash) { try { sessionStorage.setItem("shelfY", String(window.scrollY)); } catch (e) {} } });
  window.addEventListener("hashchange", route);
  document.addEventListener("keydown", function (e) {
    if (!/^#b\d+$/.test(location.hash) || /input|select|textarea/i.test(e.target.tagName)) return;
    var P = pagesOf(B[cur.i]);
    if (e.key === "ArrowRight" && cur.p < P.length - 1) turn(cur.p + 1);
    if (e.key === "ArrowLeft" && cur.p > 0) turn(cur.p - 1);
    if (e.key === "Escape") location.hash = "";
  });
  route();
})();
</script>

</body>
</html>
