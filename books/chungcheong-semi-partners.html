.chip.B { background: var(--mid-bg); color: var(--mid); }

.tw { overflow-x: auto; margin-bottom: 20px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 560px; }

th { font-size: 12px; letter-spacing: .04em; color: var(--muted); }

    { id: 'c4', title: '4장. 장비', intro: '장비 6개 사는 진공·유틸리티, 물류, 테스트·검사로 구분했습니다. 이번 조사에서 공개 자료를 충분히 확보하지 못한 구간이라 신뢰도가 낮습니다.', groups: [

      sec.innerHTML = '<h2>' + esc(ch.title) + '</h2>' +
        '<p class="lede">협력사 목록과 품목은 요청하신 표를 그대로 따랐습니다. 각 회사의 기술 설명은 공개 웹 자료(회사 홈페이지, 증권사·한국IR협의회 리포트, 언론 보도)에서 확인한 내용만 적었습니다.</p>' +
        '<div class="legend"><span><span class="chip A">자료 확인</span> 회사 자료나 보도로 확인함</span><span><span class="chip B">부분 확인</span> 일부만 확인했거나 기준 시점이 오래됨</span><span><span class="chip C">미검증</span> 이번 조사에서 근거를 찾지 못했거나 일반 지식 수준</span></div>' +
        '<div class="note">표는 46행이고 에이텍솔루션이 소재와 부품에 두 번 올라 있어 45개 회사입니다. 이 중 <b id="cntA">0</b>개는 자료 확인, <b id="cntB">0</b>개는 부분 확인, <b id="cntC">0</b>개는 미검증입니다. 미검증 항목은 사실로 쓰지 말고 후속 조사 대상으로 보세요.</div>' +
        '<h3>조사 방법과 한계</h3><ul><li>수치에는 출처와 시점을 붙였습니다. 2019년 점유율 표처럼 오래된 자료는 본문에 시점을 적었습니다.</li><li>시장점유율, 매출 순위, 1위 주장은 대부분 회사 발언이나 증권가 추정입니다. 투자·거래 판단 전에 원문 확인이 필요합니다.</li><li>비상장·외국계 법인은 한국 사업장 단위의 공개 정보가 적어 본사 자료로 대신한 곳이 있습니다. 그 경우 본문에 적었습니다.</li><li>각 회사 카드 끝의 확인할 점은 후속 조사 질문입니다.</li></ul>';
      main.appendChild(sec); return;
    }
    if (ch.kind === 'appendix') {

    sec.appendChild(el('p', 'lede', esc(ch.intro)));
    var kind = ch.title.replace(/^\d장\.\s*/, '');

  /* 부록 표 */
  var tb = document.getElementById('tb');

    var q = (document.getElementById('q').value || '').toLowerCase(), f = document.getElementById('fc').value;
    tb.innerHTML = '';

      var c = r.c, text = (c.n + c.reg + c.item).toLowerCase();

      if (f && c.conf !== f) return;
      var tr = el('tr', '', '<td>' + esc(r.kind) + '</td><td class="n"><a href="#' + slug(c.n) + (c.ref ? '-ref' : '') + '">' + esc(c.n) + '</a></td><td>' + esc(c.reg) + '</td><td>' + esc(c.item) + '</td><td><span class="chip ' + c.conf + '">' + chips[c.conf] + '</span></td>');
      tb.appendChild(tr);
    });
  }
  document.getElementById('q').addEventListener('input', rows);
  document.getElementById('fc').addEventListener('change', rows);
  rows();

  /* 모바일 목차 */
  var toc = document.getElementById('toc'), btn = document.getElementById('tocbtn');
  btn.addEventListener('click', function () { var o = toc.classList.toggle('open'); btn.textContent = o ? '목차 닫기' : '목차 열기'; });
  toclist.addEventListener('click', function (e) { if (e.target.tagName === 'A') { toc.classList.remove('open'); btn.textContent = '목차 열기'; } });
})();
</script>
